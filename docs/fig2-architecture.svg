<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="690" viewBox="0 0 1100 690" font-family="Arial, Helvetica, sans-serif"><rect width="1100" height="690" fill="#ffffff"/><text x="24" y="28" text-anchor="start" font-size="15" font-weight="bold" fill="#1f3864">WVI Subsystem Architecture</text><text x="24" y="47" text-anchor="start" font-size="10.5" font-weight="normal" fill="#5b6773">Internal software modules and data flow</text><text x="30" y="80" text-anchor="start" font-size="9.5" font-weight="bold" fill="#1f3864">INGEST ADAPTERS</text><text x="392" y="80" text-anchor="start" font-size="9.5" font-weight="bold" fill="#1f3864">CORE</text><text x="730" y="80" text-anchor="start" font-size="9.5" font-weight="bold" fill="#1f3864">DELIVERY</text><line x1="370" y1="90" x2="370" y2="620" stroke="#8d99a8" stroke-width="1" stroke-dasharray="3 3"/><line x1="712" y1="90" x2="712" y2="620" stroke="#8d99a8" stroke-width="1" stroke-dasharray="3 3"/><rect x="30" y="100" width="300" height="52" fill="#e8edf5" stroke="#8d99a8" stroke-width="1"/><text x="180.0" y="124.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#14181d">HTTP ingest endpoint</text><text x="180.0" y="140.0" text-anchor="middle" font-size="10.5" fill="#5b6773">POST /api/ingest</text><rect x="30" y="170" width="300" height="52" fill="#e8edf5" stroke="#8d99a8" stroke-width="1"/><text x="180.0" y="194.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#14181d">Simulator</text><text x="180.0" y="210.0" text-anchor="middle" font-size="10.5" fill="#5b6773">synthetic producer, development only</text><rect x="30" y="240" width="300" height="52" fill="#ffffff" stroke="#8d99a8" stroke-width="1" stroke-dasharray="4 3"/><text x="180.0" y="264.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#14181d">ROS 2 adapter</text><text x="180.0" y="280.0" text-anchor="middle" font-size="10.5" fill="#5b6773">future option, not implemented</text><rect x="30" y="540" width="300" height="52" fill="#e8edf5" stroke="#8d99a8" stroke-width="1"/><text x="180.0" y="564.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#14181d">Pi Camera module</text><text x="180.0" y="580.0" text-anchor="middle" font-size="10.5" fill="#5b6773">payload hardware</text><rect x="392" y="100" width="290" height="56" fill="#ffffff" stroke="#1f3864" stroke-width="1.6"/><text x="537.0" y="126.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#14181d">ingest()</text><text x="537.0" y="142.0" text-anchor="middle" font-size="10.5" fill="#5b6773">single entry point for all producers</text><rect x="392" y="196" width="290" height="50" fill="#ffffff" stroke="#8d99a8" stroke-width="1"/><text x="537.0" y="219.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#14181d">Schema validation</text><text x="537.0" y="235.0" text-anchor="middle" font-size="10.5" fill="#5b6773">models.py, rejects malformed data</text><rect x="392" y="278" width="290" height="54" fill="#ffffff" stroke="#8d99a8" stroke-width="1"/><text x="537.0" y="303.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#14181d">Distribution hub</text><text x="537.0" y="319.0" text-anchor="middle" font-size="10.5" fill="#5b6773">queues, latest value, staleness</text><rect x="392" y="364" width="290" height="50" fill="#ffffff" stroke="#8d99a8" stroke-width="1"/><text x="537.0" y="387.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#14181d">SQLite writer</text><text x="537.0" y="403.0" text-anchor="middle" font-size="10.5" fill="#5b6773">readings and detections tables</text><rect x="392" y="446" width="290" height="50" fill="#f2f4f7" stroke="#8d99a8" stroke-width="1"/><text x="537.0" y="469.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#14181d">telemetry.db</text><text x="537.0" y="485.0" text-anchor="middle" font-size="10.5" fill="#5b6773">one file, survives power loss</text><rect x="392" y="540" width="290" height="50" fill="#ffffff" stroke="#8d99a8" stroke-width="1"/><text x="537.0" y="563.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#14181d">Camera source</text><text x="537.0" y="579.0" text-anchor="middle" font-size="10.5" fill="#5b6773">frame capture and JPEG encode</text><rect x="730" y="108" width="290" height="50" fill="#e8edf5" stroke="#8d99a8" stroke-width="1"/><text x="875.0" y="131.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#14181d">SSE endpoint</text><text x="875.0" y="147.0" text-anchor="middle" font-size="10.5" fill="#5b6773">GET /api/stream</text><rect x="730" y="180" width="290" height="50" fill="#e8edf5" stroke="#8d99a8" stroke-width="1"/><text x="875.0" y="203.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#14181d">MJPEG endpoint</text><text x="875.0" y="219.0" text-anchor="middle" font-size="10.5" fill="#5b6773">GET /video/stream.mjpg</text><rect x="730" y="252" width="290" height="50" fill="#e8edf5" stroke="#8d99a8" stroke-width="1"/><text x="875.0" y="275.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#14181d">Query API</text><text x="875.0" y="291.0" text-anchor="middle" font-size="10.5" fill="#5b6773">history, targets, latency</text><rect x="730" y="324" width="290" height="50" fill="#e8edf5" stroke="#8d99a8" stroke-width="1"/><text x="875.0" y="347.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#14181d">Static assets</text><text x="875.0" y="363.0" text-anchor="middle" font-size="10.5" fill="#5b6773">dashboard HTML, CSS, JS</text><rect x="730" y="440" width="290" height="60" fill="#ffffff" stroke="#1f3864" stroke-width="1.6"/><text x="875.0" y="468.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#14181d">Browser client</text><text x="875.0" y="484.0" text-anchor="middle" font-size="10.5" fill="#5b6773">Ground Control Station</text><polyline points="330,126 392,122" fill="none" stroke="#1f3864" stroke-width="1.5"/><polygon points="392.0,122.0 381.3,127.3 380.7,118.1" fill="#1f3864"/><polyline points="330,196 392,134" fill="none" stroke="#1f3864" stroke-width="1.5"/><polygon points="392.0,134.0 387.5,145.0 381.0,138.5" fill="#1f3864"/><polyline points="330,266 392,146" fill="none" stroke="#1f3864" stroke-width="1.5" stroke-dasharray="4 3"/><polygon points="392.0,146.0 391.0,157.9 382.9,153.7" fill="#1f3864"/><polyline points="330,566 392,566" fill="none" stroke="#1f3864" stroke-width="1.5"/><polygon points="392.0,566.0 381.0,570.6 381.0,561.4" fill="#1f3864"/><polyline points="537,156 537,196" fill="none" stroke="#1f3864" stroke-width="1.5"/><polygon points="537.0,196.0 532.4,185.0 541.6,185.0" fill="#1f3864"/><polyline points="537,246 537,278" fill="none" stroke="#1f3864" stroke-width="1.5"/><polygon points="537.0,278.0 532.4,267.0 541.6,267.0" fill="#1f3864"/><polyline points="475,332 475,364" fill="none" stroke="#1f3864" stroke-width="1.5"/><polygon points="475.0,364.0 470.4,353.0 479.6,353.0" fill="#1f3864"/><polyline points="537,414 537,446" fill="none" stroke="#1f3864" stroke-width="1.5"/><polygon points="537.0,446.0 532.4,435.0 541.6,435.0" fill="#1f3864"/><polyline points="682,305 716,305 716,133 730,133" fill="none" stroke="#1f3864" stroke-width="1.5"/><polygon points="730.0,133.0 719.0,137.6 719.0,128.4" fill="#1f3864"/><polyline points="682,471 700,471 700,277 730,277" fill="none" stroke="#1f3864" stroke-width="1.5"/><polygon points="730.0,277.0 719.0,281.6 719.0,272.4" fill="#1f3864"/><polyline points="682,565 692,565 692,205 730,205" fill="none" stroke="#1f3864" stroke-width="1.5"/><polygon points="730.0,205.0 719.0,209.6 719.0,200.4" fill="#1f3864"/><line x1="1020" y1="133" x2="1058" y2="133" stroke="#1f3864" stroke-width="1.5"/><line x1="1020" y1="205" x2="1058" y2="205" stroke="#1f3864" stroke-width="1.5"/><line x1="1020" y1="277" x2="1058" y2="277" stroke="#1f3864" stroke-width="1.5"/><line x1="1020" y1="349" x2="1058" y2="349" stroke="#1f3864" stroke-width="1.5"/><line x1="1058" y1="133" x2="1058" y2="470" stroke="#1f3864" stroke-width="1.5"/><polyline points="1058,470 1020,470" fill="none" stroke="#1f3864" stroke-width="1.5"/><polygon points="1020.0,470.0 1031.0,465.4 1031.0,474.6" fill="#1f3864"/><text x="469" y="356" text-anchor="end" font-size="9" font-weight="normal" fill="#5b6773">write</text><text x="720" y="220" text-anchor="start" font-size="9" font-weight="normal" fill="#5b6773">push</text><text x="704" y="380" text-anchor="start" font-size="9" font-weight="normal" fill="#5b6773">read</text><text x="24" y="646" text-anchor="start" font-size="9.5" font-weight="normal" fill="#5b6773">ingest() is the single entry point: every producer, real or simulated, passes through the same validation and</text><text x="24" y="662" text-anchor="start" font-size="9.5" font-weight="normal" fill="#5b6773">persistence path. Changing the source of data therefore requires no change to the core or delivery layers.</text></svg>