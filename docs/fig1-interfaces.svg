<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="640" viewBox="0 0 1060 640" font-family="Arial, Helvetica, sans-serif"><rect width="1060" height="640" fill="#ffffff"/><text x="24" y="28" text-anchor="start" font-size="15" font-weight="bold" fill="#1f3864">WVI Subsystem Interface and Control Diagram</text><text x="24" y="47" text-anchor="start" font-size="10.5" font-weight="normal" fill="#5b6773">UAVPayload-TAQ-26 Group One  ·  Web Visualisation Subsystem (WVI)</text><rect x="300" y="76" width="440" height="462" fill="#fcfdfe" stroke="#1f3864" stroke-width="1.6" stroke-dasharray="6 4"/><text x="520.0" y="311.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#14181d"></text><text x="520" y="100" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1f3864">WEB VISUALISATION SUBSYSTEM (WVI)</text><text x="520" y="116" text-anchor="middle" font-size="9.5" font-weight="normal" fill="#5b6773">edge-hosted service on the payload computer</text><rect x="350" y="132" width="330" height="54" fill="#e8edf5" stroke="#8d99a8" stroke-width="1"/><text x="515.0" y="157.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#14181d">Ingest and validation</text><text x="515.0" y="173.0" text-anchor="middle" font-size="10.5" fill="#5b6773">schema check, timestamping</text><rect x="350" y="214" width="330" height="54" fill="#e8edf5" stroke="#8d99a8" stroke-width="1"/><text x="515.0" y="239.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#14181d">Distribution hub</text><text x="515.0" y="255.0" text-anchor="middle" font-size="10.5" fill="#5b6773">fan-out, latest value, staleness</text><rect x="350" y="296" width="330" height="54" fill="#e8edf5" stroke="#8d99a8" stroke-width="1"/><text x="515.0" y="321.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#14181d">Persistence</text><text x="515.0" y="337.0" text-anchor="middle" font-size="10.5" fill="#5b6773">SQLite timestamped log</text><rect x="350" y="378" width="3