t><text x="130.0" y="167.0" text-anchor="middle" font-size="10.5" fill="#5b6773">Enviro+ sensor board</text><rect x="40" y="208" width="180" height="54" fill="#ffffff" stroke="#8d99a8" stroke-width="1"/><text x="130.0" y="233.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#14181d">Image Processing (IP)</text><text x="130.0" y="249.0" text-anchor="middle" font-size="10.5" fill="#5b6773">onboard detector</text><rect x="40" y="290" width="180" height="54" fill="#ffffff" stroke="#8d99a8" stroke-width="1"/><text x="130.0" y="315.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#14181d">Target Analysis (TAI)</text><text x="130.0" y="331.0" text-anchor="middle" font-size="10.5" fill="#5b6773">classification, alerts</text><rect x="40" y="400" width="180" height="54" fill="#ffffff" stroke="#8d99a8" stroke-width="1"/><text x="130.0" y="425.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#14181d">Payload camera</text><text x="130.0" y="441.0" text-anchor="middle" font-size="10.5" fill="#5b6773">Pi Camera module</text><rect x="830" y="250" width="190" height="84" fill="#ffffff" stroke="#8d99a8" stroke-width="1"/><text x="925.0" y="290.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#14181d">Ground Control</text><text x="925.0" y="306.0" text-anchor="middle" font-size="10.5" fill="#5b6773">Station browser</text><text x="925" y="350" text-anchor="middle" font-size="9.5" font-weight="normal" fill="#5b6773">remote, QUT lab LAN</text><rect x="300" y="566" width="440" height="44" fill="#f2f4f7" stroke="#8d99a8" stroke-width="1"/><text x="520.0" y="586.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#14181d">Raspberry Pi platform</text><text x="520.0" y="602.0" text-anchor="middle" font-size="10.5" fill="#5b6773">Linux, Python 3, WLAN interface</text><polyline points="220,153 350,148" fill="none" stroke="#1f3864" stroke-width="1.5"/><polygon points="350.0,148.0 339.2,153.0 338.8,143.8" fill="#1f3864"/><pol