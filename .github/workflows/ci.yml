name: ci

# Gate: every module parses, the declared dependencies actually resolve, and
# there are no undefined names or syntax-level errors.
#
# There is no test suite in this repo yet, so this workflow deliberately does
# not pretend to run one. A green tick here means "it imports and installs",
# not "it works" - worth being honest about rather than adding a placeholder
# test that asserts nothing.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 3.12 matches the version pinned across the other repos, so a build
      # that passes here passes on the machines too.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: install dependencies
        run: pip install -r requirements.txt

      - name: syntax check every module
        run: python -m compileall -q app tools run.py

      # Error-level rules only: undefined names, broken except clauses, syntax
      # errors. Style rules would fail a repo that was never written to them.
      - name: lint
        run: |
          pip install ruff
          ruff check . --select=E9,F63,F7,F82 --output-format=github

  # ---------------------------------------------------------------------------
  # CD. Runs only after the gate above is green, only on a push to main, never
  # on a pull request. Deploying code that has not passed CI is therefore not
  # possible - which is why this lives here rather than in a separate workflow
  # keyed on workflow_run, where the gate is advisory rather than enforced.
  #
  # The org and project ids are not secrets: they name a project, they do not
  # grant access to it. Only VERCEL_TOKEN is sensitive, so there is exactly one
  # secret to manage.
  # ---------------------------------------------------------------------------
  deploy:
    needs: python
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_9DpT50im16Ck3www89qBdIVU
      VERCEL_PROJECT_ID: prj_EYchwZ8IznLMCsvoMrBTv3b1wTIg
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Without this the job fails with an opaque CLI error until the secret
      # exists. Warn loudly and stay green instead, so adding the token is the
      # only thing that stands between this repo and a working deploy.
      - name: check deploy credentials
        id: creds
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::warning::VERCEL_TOKEN is not set - deploy skipped. Add it with: gh secret set VERCEL_TOKEN --repo ${{ github.repository }}"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: deploy to Vercel production
        if: steps.creds.outputs.ready == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          url=$(npx --yes vercel@latest deploy --prod --yes --token="$VERCEL_TOKEN")
          echo "Deployed: $url"
          echo "Deployed $url" >> "$GITHUB_STEP_SUMMARY"
